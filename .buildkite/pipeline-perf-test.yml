steps:
  - label: ":chart_with_upwards_trend: perf test lint"
    command: ".buildkite/scripts/steps/perf-test-lint.sh"
    # Every perf fixture test, plus perf-test-env-test.sh re-running four of them under two A/B envs.
    timeout_in_minutes: 10
    retry:
      automatic:
        - exit_status: -1   # agent lost (e.g. Spot reclamation)
          limit: 2
        - exit_status: 255  # agent forced shutdown
          limit: 2

  # Opt-in load test: runs only on manual ("New Build") or scheduled builds, not
  # on every commit, so it does not keep scale-to-zero agents busy. k6 load.js
  # thresholds are the pass/fail gate.
  - label: ":k6: k6 load test"
    command: ".buildkite/scripts/steps/perf-test-load.sh"
    timeout_in_minutes: 20
    # Exclude the weekly soak build (its schedule carries [perf-soak]): a soak
    # build must run ONLY the soak step, not the ad-hoc load test.
    if: "(build.source == 'ui' || build.source == 'schedule') && build.message !~ /\\[perf-soak\\]/"
    agents:
      queue: "default"
    retry:
      automatic:
        - exit_status: -1   # agent lost (e.g. Spot reclamation)
          limit: 2
        - exit_status: 255  # agent forced shutdown
          limit: 2

  # Daily performance-REGRESSION run (notify-only, stored-history baseline).
  # Schedules follow local.perf_schedules_enabled (terraform/buildkite-pipelines/perf-schedules.tf);
  # while it is false, runs are UI, [perf-run] or [perf-soak] builds only.
  # Scheduled daily when enabled; the guard dynamically dispatches the heavy run/micro-bench/
  # compare steps (on the dedicated pinned `perf` queue) ONLY when master moved
  # since the last successful run. Cheap `trigger` queue for the guard itself.
  - label: ":mag: perf regression — commit guard + dispatch"
    command: ".buildkite/scripts/steps/perf-test-guard.sh"
    timeout_in_minutes: 10
    # `[perf-run]` in the build message is an explicit, safe force-trigger for a
    # manual/API run (orchestrator/commit builds never carry it, so the daily-only
    # design is preserved). UI and scheduled builds dispatch as before — EXCEPT the
    # weekly soak build (its schedule carries [perf-soak]): a soak build must NOT
    # also dispatch the daily regression run, which would compete with the soak for
    # the perf agents (the collision item 10 avoids by scheduling the soak out of
    # the daily's slot).
    if: "(build.source == 'ui' || build.source == 'schedule' || build.message =~ /\\[perf-run\\]/) && build.message !~ /\\[perf-soak\\]/"
    agents:
      queue: "trigger"
    retry:
      automatic:
        - exit_status: -1   # agent lost (e.g. Spot reclamation)
          limit: 2
        - exit_status: 255  # agent forced shutdown
          limit: 2

  # WEEKLY SOAK run (item 10 of the performance programme). Dispatched by a
  # SEPARATE weekly schedule (terraform/buildkite-pipelines/pipelines.tf) whose
  # message carries [perf-soak] — NOT by the daily 04:00 regression schedule. A
  # daily build can hold every perf agent at once, so the weekly schedule fires
  # well clear of the 04:00 regression and 16:00 baseline-freshness slots.
  # soak.js runs match/create under sustained load with two low-rate event-log
  # queries (verify + retrieveRecordedRequests — item 10b) whose latency is
  # recorded AGAINST log occupancy. The soak result (perf-soak.json) is NOT fed to the
  # daily baseline compare (still deferred); but a k6 threshold breach (absolute match
  # p95/p99 gates / error rate) OR a missing/empty result reds this build.
  - label: ":zzz: perf soak — weekly (2h, event-log fill)"
    command: ".buildkite/scripts/steps/perf-test-soak.sh"
    if: "build.message =~ /\\[perf-soak\\]/"
    # 2h soak + boot + summary + teardown. ~48m margin over 120m under cloud noise.
    timeout_in_minutes: 170
    agents:
      queue: "perf"
    retry:
      automatic:
        - exit_status: -1   # agent lost (e.g. Spot reclamation)
          limit: 2
        - exit_status: 255  # agent forced shutdown
          limit: 2

  # On-demand INFO-level investigation: an API build with PERF_INFO_INVESTIGATION=jfr|heap|both|promotion
  # and no perf marker. Never compared or baselined. See docs/infrastructure/ci-cd.md (INFO-Level Investigation).
  - label: ":mag: INFO investigation — event-log consumer JFR"
    command: ".buildkite/scripts/steps/perf-test-info-investigation.sh"
    if: "build.source == 'api' && build.env('PERF_INFO_INVESTIGATION') != null && build.env('PERF_INFO_INVESTIGATION') =~ /^(jfr|both)$/ && build.message !~ /\\[perf-(run|soak)\\]/"
    env:
      PERF_INFO_INVESTIGATION_PART: "jfr"
    timeout_in_minutes: 40
    agents:
      queue: "perf"
    retry:
      automatic:
        - exit_status: -1   # agent lost (e.g. Spot reclamation)
          limit: 2
        - exit_status: 255  # agent forced shutdown
          limit: 2
  - label: ":mag: INFO investigation — event-log heap per counted byte"
    command: ".buildkite/scripts/steps/perf-test-info-investigation.sh"
    if: "build.source == 'api' && build.env('PERF_INFO_INVESTIGATION') != null && build.env('PERF_INFO_INVESTIGATION') =~ /^(heap|both)$/ && build.message !~ /\\[perf-(run|soak)\\]/"
    env:
      PERF_INFO_INVESTIGATION_PART: "heap"
    timeout_in_minutes: 180
    agents:
      queue: "perf"
    retry:
      automatic:
        - exit_status: -1   # agent lost (e.g. Spot reclamation)
          limit: 2
        - exit_status: 255  # agent forced shutdown
          limit: 2
  - label: ":mag: INFO investigation — young-GC promotion per retention divisor"
    command: ".buildkite/scripts/steps/perf-test-info-investigation.sh"
    if: "build.source == 'api' && build.env('PERF_INFO_INVESTIGATION') != null && build.env('PERF_INFO_INVESTIGATION') == 'promotion' && build.message !~ /\\[perf-(run|soak)\\]/"
    env:
      PERF_INFO_INVESTIGATION_PART: "promotion"
    timeout_in_minutes: 150
    agents:
      queue: "perf"
    retry:
      automatic:
        - exit_status: -1   # agent lost (e.g. Spot reclamation)
          limit: 2
        - exit_status: 255  # agent forced shutdown
          limit: 2

  # Repeats one mockserver-netty integration test under CPU load, only in an API-created
  # build with TEST_REPEAT_IT set and no perf marker, so no k6, guard or soak step shares
  # the build. See "Repeating One Integration Test" in docs/infrastructure/ci-cd.md.
  - label: ":repeat: test repeat under load"
    command: ".buildkite/scripts/steps/java-test-repeat.sh"
    if: "build.source == 'api' && build.env('TEST_REPEAT_IT') != null && build.message !~ /\\[perf-(run|soak)\\]/"
    timeout_in_minutes: 240
    agents:
      queue: "default"
    artifact_paths:
      - "test-repeat/**/*"
    retry:
      automatic:
        - exit_status: -1   # agent lost (e.g. Spot reclamation)
          limit: 2
        - exit_status: 255  # agent forced shutdown
          limit: 2
