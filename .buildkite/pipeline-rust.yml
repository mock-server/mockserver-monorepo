steps:
  - label: ":rust: Rust client tests + clippy"
    command: ".buildkite/scripts/steps/rust-unit-test.sh"
    timeout_in_minutes: 15
    retry:
      automatic:
        - exit_status: -1   # agent lost (e.g. Spot reclamation)
          limit: 2
        - exit_status: 255  # agent forced shutdown
          limit: 2

  - label: ":rust: Rust client tests + clippy on MSRV"
    command: ".buildkite/scripts/steps/rust-msrv-test.sh"
    timeout_in_minutes: 15
    retry:
      automatic:
        - exit_status: -1   # agent lost (e.g. Spot reclamation)
          limit: 2
        - exit_status: 255  # agent forced shutdown
          limit: 2

  - label: ":rust: Rust website examples match the REST API tab"
    command: ".buildkite/scripts/steps/website-examples.sh rust"
    timeout_in_minutes: 25
    retry:
      automatic:
        - exit_status: -1   # agent lost (e.g. Spot reclamation)
          limit: 2
        - exit_status: 255  # agent forced shutdown
          limit: 2

  # tests/integration_test.rs is entirely #[ignore]d; without `-- --ignored`
  # cargo test reported success having run none of it.
  - label: ":rust: :docker: Rust client integration tests"
    command: ".buildkite/scripts/steps/rust-integration-test.sh"
    timeout_in_minutes: 20
    retry:
      automatic:
        - exit_status: -1   # agent lost (e.g. Spot reclamation)
          limit: 2
        - exit_status: 255  # agent forced shutdown
          limit: 2
        # Builds the mockserver jar from HEAD (Maven) before testing. A transient
        # Maven Central resolution failure is remapped to sentinel 42 by
        # run-in-docker.sh; a real test failure exits 1 and can never reach 42.
        - exit_status: 42   # transient Maven Central resolution failure
          limit: 2

  # soft_fail removed: a failing testcontainers suite reported green.
  - label: ":rust: :docker: Rust testcontainers tests"
    command: ".buildkite/scripts/steps/rust-testcontainers-test.sh"
    timeout_in_minutes: 15
    retry:
      automatic:
        - exit_status: -1   # agent lost (e.g. Spot reclamation)
          limit: 2
        - exit_status: 255  # agent forced shutdown
          limit: 2
