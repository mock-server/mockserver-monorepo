# ---------------------------------------------------------------------------
# Single source of truth for the container images used by the Docker-gated
# test suites (cloud blob-store + asyncapi live-broker).
#
# Read by BOTH:
#   - org.mockserver.test.TestContainerImages  (the test suites)
#   - .buildkite/scripts/lib/test-images.sh    (the CI pre-pull call sites)
#
# so the test constants and the pre-pull list can no longer drift. To bump a
# tag or add a backing image, change it HERE (and, for a NEW registry host, add
# a pull-through rule in terraform/buildkite-agents/ecr-pull-through-cache.tf and
# a host->prefix mapping in both resolvers).
#
# Values are the PUBLIC image references. In CI they are optionally rewritten to
# the ECR pull-through cache when MOCKSERVER_TEST_IMAGE_REGISTRY is set; locally
# and on forks (no ECR access) they are used verbatim.
# ---------------------------------------------------------------------------
s3mock=adobe/s3mock:5.2.3
fake-gcs-server=fsouza/fake-gcs-server:1.49.3
azurite=mcr.microsoft.com/azure-storage/azurite:3.36.0
cp-kafka=confluentinc/cp-kafka:7.6.1
rabbitmq=rabbitmq:3.13-management
eclipse-mosquitto=eclipse-mosquitto:2.0.22
