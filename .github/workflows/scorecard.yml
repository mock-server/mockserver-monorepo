name: scorecard

# OpenSSF Scorecard supply-chain posture checks (Branch-Protection, Pinned-Dependencies,
# Token-Permissions, Signed-Releases and others). Findings are uploaded as SARIF (category
# `scorecard`) and appear as code scanning alerts in the Security tab.
#
# publish_results is false, so the job needs no id-token and nothing is sent to the public
# Scorecard API. Scorecard scores the default branch, so this does not run on pull requests.
# ossf/scorecard-action is not GitHub-owned: the repository's allowed-actions list must name it
# (docs/operations/security.md → OpenSSF Scorecard).

on:
  push:
    branches: [master]
  branch_protection_rule:
  schedule:
    - cron: '17 6 * * 3'
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 140
    permissions:
      contents: read
      actions: read  # find this commit's gradle-wrapper-validation run
      security-events: write  # upload SARIF to code scanning
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Binary-Artifacts accepts the Gradle wrapper jars only when Scorecard's own query (first page of
      # status=success runs, no head_sha filter) lists this commit. That list can lag the finished run by
      # over an hour, so poll the same query for up to 2 hours; a newer push cancels the wait.
      - name: Wait for this commit's Gradle wrapper validation
        if: github.event_name == 'push'
        timeout-minutes: 126
        continue-on-error: true  # a stuck wait still lets Scorecard run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 240); do
            listed=$(gh api "repos/${REPO}/actions/workflows/gradle-wrapper-validation.yml/runs?status=success" \
              --jq "[.workflow_runs[].head_sha] | index(\"${SHA}\") != null") || listed=false
            if [ "${listed}" = "true" ]; then exit 0; fi
            head=$(gh api "repos/${REPO}/commits/master" --jq '.sha') || head="${SHA}"
            if [ "${head}" != "${SHA}" ]; then
              echo "::warning::master moved to ${head} during the wait; Scorecard will score that commit"
              exit 0
            fi
            if [ $((i % 10)) -eq 0 ]; then echo "waited $((i / 2)) minutes; ${SHA} not yet in the status=success run list"; fi
            sleep 30
          done
          echo "::warning::gradle-wrapper-validation for ${SHA} not in the status=success run list after 2 hours; Binary-Artifacts will flag the wrapper jars"

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
