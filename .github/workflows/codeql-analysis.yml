# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
name: "CodeQL"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 22 * * 2'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Override automatic language detection by changing the below list
        # Supported options are ['csharp', 'cpp', 'go', 'java', 'javascript', 'python']
        language: ['java', 'javascript', 'python', 'ruby']

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up JDK 17
      if: matrix.language == 'java'
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43  # v4.37.5
      with:
        languages: ${{ matrix.language }}

    - name: Build with Maven
      if: matrix.language == 'java'
      working-directory: mockserver
      # 'package' (not 'compile') is required: mockserver-examples depends on
      # the *-no-dependencies shaded jars, whose classes only exist after the
      # maven-shade-plugin runs in the package phase. A compile-only build
      # leaves those jars empty and mockserver-examples fails to compile.
      run: ./mvnw -B clean package -DskipTests -Dmaven.javadoc.skip=true
      env:
        MAVEN_OPTS: -Xmx2048m

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43  # v4.37.5
