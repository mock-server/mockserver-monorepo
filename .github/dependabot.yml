version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/mockserver"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "java"
    groups:
      maven-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Future Java floor or namespace migrations may add ignores here.
      # The javax → jakarta block was removed when the codebase migrated.
      #
      # KEEP IN SYNC: any ignore below that guards a dependency DECLARED IN THIS pom
      # (mockserver/pom.xml) must ALSO be added to the Dependabot entry whose poms inherit this
      # one as their <parent> — the /examples/java + /mockserver/mockserver-maven-plugin entry.
      # Dependabot scanning those child directories resolves up into this parent and can bump the
      # same declaration while branding the PR with the child scope; a lone ignore here does NOT
      # cover them (that gap generated the un-passable checkstyle 13 PR #2554 from /examples/java).
      # Ignores that guard a dependency declared only in a sibling MODULE pom (e.g. infinispan-core
      # in mockserver-state-infinispan) are NOT inherited and must NOT be mirrored.
      #
      # checkstyle 13.x requires Java 21 runtime; we target Java 17.
      # Pin the ceiling below 13.0.0 — this is stricter than ignoring only
      # semver-major bumps and keeps us on the Java-17-compatible 12.x line.
      - dependency-name: "com.puppycrawl.tools:checkstyle"
        versions: [">=13.0.0"]
      # Infinispan 15.x requires Java 21 runtime; we target Java 17.
      # Pin the ceiling below 15.0.0 to stay on the Java-17-compatible 14.0.x line.
      - dependency-name: "org.infinispan:infinispan-core"
        versions: [">=15.0.0"]
      # No ignore is needed for io.netty:netty-tcnative-boringssl-static. It carries no
      # version anywhere in the poms - netty-bom governs the base artifact and every
      # per-platform classifier together - so Dependabot has nothing to bump and cannot
      # reintroduce a pin. Bumping netty.version moves tcnative transitively in lockstep,
      # and the Docker native download derives its version from the jar's
      # META-INF/mockserver-tcnative.version stamp. The old standalone ignore existed
      # because an explicit override let the base artifact diverge from the classifiers
      # and break dependencyConvergence (PR #2332); that override is gone.
      # graphql-java through 26.x ships Java 11 bytecode and runs on the Java 17 floor.
      # A future major could raise the runtime floor, so ceiling-pin below the next
      # unreleased major: minor/patch bumps on the in-use line auto-update, but a major
      # must be manually verified to still build/run on Java 17 first.
      #
      # KEEP THIS CEILING ABOVE THE VERSION IN USE (mockserver/pom.xml). It read
      # ">=25.0.0" while the pom was already on 26.0, so it suppressed EVERY graphql-java
      # update — patches and security fixes included — because the in-use version was
      # itself above the ceiling. A ceiling at or below the pinned version looks exactly
      # like a working one: no PRs appear either way.
      - dependency-name: "com.graphql-java:graphql-java"
        versions: [">=27.0.0"]
      # classgraph 6.x ships Java 25 bytecode (class file 69); the 5.x line is its Java 17 build.
      - dependency-name: "io.github.classgraph:classgraph"
        versions: [">=6.0.0"]
      # Kotlin (mockserver-client-kotlin's kotlin.version: kotlin-stdlib and kotlin-maven-plugin) is capped at
      # the newest version the CodeQL Java/Kotlin extractor supports; a newer one is silently not analysed.
      # Raise it when CodeQL supports a newer Kotlin (docs/operations/security.md). Module-only: not mirrored.
      - dependency-name: "org.jetbrains.kotlin:*"
        versions: [">=2.4.21"]

  # The two Maven directories whose pom inherits mockserver/pom.xml but is NOT a /mockserver
  # reactor module (adding examples/java as a module made Dependabot abort every grouped core
  # update with "No pom.xml!" — see mockserver/pom.xml). One entry, so a bump both reach (usually
  # a parent-pom declaration) is ONE grouped PR, not one per directory. Labels are the union of
  # the former per-directory blocks.
  #
  # NOT merged into /mockserver: an entry's ignores apply to every directory in it, and its Kotlin
  # ceiling (org.jetbrains.kotlin:* >=2.4.21) would freeze examples/java's kotlin-stdlib pins,
  # which are already at 2.4.21 — blocking every update to them, security fixes included.
  - package-ecosystem: "maven"
    directories:
      - "/examples/java"
      - "/mockserver/mockserver-maven-plugin"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "java"
      - "maven-plugin"
    groups:
      maven-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # SYNC-WITH-PARENT — read before adding or removing anything here.
      # Both directories resolve UP into mockserver/pom.xml, so Dependabot scanning them can bump
      # any dependency declared in that parent while branding the PR with the child directory.
      # That is exactly how the un-passable checkstyle 12.3.1 -> 13.10.0 PR #2554 was generated
      # from /examples/java even though the /mockserver entry already ignored checkstyle >= 13.
      # Therefore every ignore in the /mockserver entry that guards a dependency DECLARED IN THE
      # PARENT pom must be mirrored here.
      # NOT mirrored: org.infinispan:infinispan-core and the org.jetbrains.kotlin:* ceiling — both
      # guard reactor MODULE poms (mockserver-state-infinispan, mockserver-client-kotlin), off these
      # directories' parent chain. examples/java's own kotlin-stdlib pins must keep updating.
      # No netty-tcnative-boringssl-static ignore, for the reason given in the /mockserver entry.
      #
      # checkstyle 13.x requires Java 21 runtime; we target Java 17.
      # Pin the ceiling below 13.0.0 — this is stricter than ignoring only
      # semver-major bumps and keeps us on the Java-17-compatible 12.x line.
      - dependency-name: "com.puppycrawl.tools:checkstyle"
        versions: [">=13.0.0"]
      # graphql-java through 26.x ships Java 11 bytecode and runs on the Java 17 floor.
      # A future major could raise the runtime floor, so ceiling-pin below the next
      # unreleased major: minor/patch bumps on the in-use line auto-update, but a major
      # must be manually verified to still build/run on Java 17 first.
      #
      # KEEP THIS CEILING ABOVE THE VERSION IN USE (mockserver/pom.xml). It read
      # ">=25.0.0" while the pom was already on 26.0, so it suppressed EVERY graphql-java
      # update — patches and security fixes included — because the in-use version was
      # itself above the ceiling. A ceiling at or below the pinned version looks exactly
      # like a working one: no PRs appear either way.
      - dependency-name: "com.graphql-java:graphql-java"
        versions: [">=27.0.0"]
      # classgraph 6.x ships Java 25 bytecode (class file 69); the 5.x line is its Java 17 build.
      - dependency-name: "io.github.classgraph:classgraph"
        versions: [">=6.0.0"]

  # The healthy npm directories share one grouped job. mockserver-vscode is
  # split into its own block below so a failure there (e.g. an EOVERRIDE while
  # regenerating its lockfile) can no longer abort PR creation for these three.
  # /.opencode was removed from this list: it has no tracked package.json (only
  # an orphan package-lock.json), so Dependabot could never resolve it — the
  # lockfile has been untracked instead.
  # mockserver-ui is in its OWN block because its TypeScript ignore below is
  # UI-specific and must not leak onto the other npm directories — the same
  # reason mockserver-vscode is split out further down.
  - package-ecosystem: "npm"
    directory: "/mockserver-ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        # jsdom is pinned to a minor (~); each minor bump gets its own PR so the
        # test-setup check in docs/code/dashboard-ui.md can be judged on its own.
        exclude-patterns:
          - "jsdom"
    ignore:
      # TypeScript 7.x is blocked by typescript-eslint, whose peer range is
      # `typescript >=4.8.4 <6.1.0`. `npm ci` fails with ERESOLVE before lint or
      # typecheck can run, so the bump cannot pass the UI gate no matter what
      # else moves — nothing else in the tree raises that ceiling. TypeScript 7
      # is the new native-compiler major and typescript-eslint support for it is
      # a large piece of upstream work with no committed date.
      #
      # SCOPED TO THIS DIRECTORY ONLY. When this ignore lived on a block shared
      # with /mockserver-client-node it froze that package's typescript, which
      # was ALREADY on ~7.0.2 (landed green in July — it has no typescript-eslint,
      # so the peer conflict does not apply there). An ignore whose ceiling sits
      # at or below a directory's in-use version suppresses every update for it,
      # security patches included, and looks identical to a working ceiling: no
      # pull requests appear either way. Keep directory-specific constraints in
      # directory-specific blocks.
      #
      # REVISIT when typescript-eslint publishes a release whose peer range
      # admits typescript 7 (watch https://github.com/typescript-eslint/typescript-eslint).
      # At that point remove this ignore and bump both together — typescript
      # alone will still fail. PR #2547 was closed under this rule.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  # The published Node packages. No TypeScript ignore here: mockserver-client-node
  # is on typescript ~7.0.2 already and carries no typescript-eslint, so the UI's
  # constraint does not apply and must not freeze it.
  - package-ecosystem: "npm"
    directories:
      - "/mockserver-client-node"
      - "/mockserver-node"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # mockserver-vscode in its own block so one bad directory cannot take down the
  # healthy npm directories above. The @types/vscode ignore is vscode-specific.
  - package-ecosystem: "npm"
    directory: "/mockserver-vscode"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @types/vscode's MINOR version is the VS Code API level, so it is not a
      # routine minor bump: vsce refuses to package an extension whose
      # @types/vscode exceeds engines.vscode. Raising it is a deliberate decision
      # to drop support for older VS Code, which belongs with an engines.vscode
      # change, not a dependency sweep. Bumped 1.80.0 -> 1.125.0 inside the
      # minor-and-patch group in #21d7ae412; compile stayed green because this is
      # a vsce rule rather than a tsc one, and it surfaced only when the release
      # packaged the extension, leaving 8.0.0 without a VS Code release.
      # Ceiling matches engines.vscode ^1.80.0.
      - dependency-name: "@types/vscode"
        versions: [">=1.81.0"]

  - package-ecosystem: "pip"
    directory: "/mockserver-client-python"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    groups:
      pip-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The hash-pinned build/twine set the PyPI publish components install
  # (scripts/release/requirements-publish.txt, compiled from the .in file). One group so a
  # version bump arrives as one PR that dependabot-auto-merge.yml never merges, because only a
  # release runs these tools; a security-update PR still follows the auto-merge security rule.
  - package-ecosystem: "pip"
    directory: "/scripts/release"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    groups:
      release-publish-tools:
        patterns:
          - "*"

  - package-ecosystem: "bundler"
    directories:
      - "/mockserver-client-ruby"
      - "/jekyll-www.mock-server.com"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ruby"
    groups:
      bundler-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The examples resolve mockserver-client-go through a local `replace`, so only
  # their own third-party requirements are updated here. examples/wasm/go has no
  # dependencies and is left out.
  - package-ecosystem: "gomod"
    directories:
      - "/mockserver-client-go"
      - "/mockserver-testcontainers/go"
      - "/examples/go/callback"
      - "/examples/go/create_expectation"
      - "/examples/go/load_scenario"
      - "/examples/go/modify_proxied_response"
      - "/examples/go/parallel_search_mcp"
      - "/examples/go/scenario"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    groups:
      gomod-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/mockserver-client-rust"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    groups:
      cargo-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directories:
      - "/mockserver-client-dotnet"
      - "/mockserver-testcontainers/dotnet"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    # Explicit, so NuGet PRs carry the build(deps) prefix of the other ecosystems.
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
      - ".NET"
    groups:
      nuget-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # FluentAssertions 8.x is no longer Apache-2.0: it is proprietary (Xceed),
      # and commercial use needs a paid licence. Stay on the Apache-2.0 7.x line.
      - dependency-name: "FluentAssertions"
        versions: [">=8.0.0"]
      # MockServer.Testcontainers keeps MockServerClient at the open-ended floor
      # [7.1.0,), as the other Testcontainers modules do for their client, so
      # consumers pick their client version. A Dependabot bump raises that floor.
      - dependency-name: "MockServerClient"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directories:
      - "/docker"
      - "/docker/root"
      - "/docker/root-snapshot"
      - "/docker/snapshot"
      - "/docker/graaljs"
      - "/docker/local"
      - "/docker/aot"
      - "/docker/webhook"
      - "/docker/clustered"
      - "/docker/http3"
      - "/container_integration_tests/client_docker_images"
      - "/container_integration_tests/docker_compose_libs_classpath"
      - "/container_integration_tests/docker_compose_war_tomcat"
      - "/docker_build/maven"
      - "/docker_build/performance"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "docker"
    groups:
      # The eight server images each build the HEALTHCHECK probe from the same pinned golang image;
      # one PR across every directory (digest bumps included) keeps them on one Go toolchain.
      # Listed first because an update joins the first group it matches.
      healthcheck-golang:
        patterns:
          - "golang"
        group-by: dependency-name
      # The builder stages' alpine and eclipse-temurin bases are digest-pinned in every image
      # directory, so a digest bump would otherwise arrive as one PR per directory. One PR per image
      # instead; not a -minor-and-patch group, so dependabot-auto-merge.yml never merges it.
      build-stage-bases:
        patterns:
          - "alpine"
          - "eclipse-temurin"
        group-by: dependency-name
      docker-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Release toolchain images (read by scripts/release/_lib.sh). A separate entry so every bump,
  # digest-only included, lands in one release-tool-images PR, which dependabot-auto-merge.yml
  # never merges: these images run only during a release, so CI cannot prove a bump safe.
  - package-ecosystem: "docker"
    directory: "/scripts/release/images"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    groups:
      release-tool-images:
        patterns:
          - "*"
    # Digest refreshes and patch updates only: a move to a new minor or major line (node 25,
    # python 3.15, terraform 1.16, dotnet 11.0, alpine/helm 4) is a hand edit. maven is
    # digest-only because Dependabot reads the tag's JDK number as a version segment, so
    # 3.9.16-eclipse-temurin-17 -> 3.9-eclipse-temurin-26 looks like a patch.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "maven"
        update-types:
          - "version-update:semver-patch"

  - package-ecosystem: "terraform"
    directories:
      - "/terraform/buildkite-agents"
      - "/terraform/buildkite-pipelines"
      - "/terraform/ses-email-forwarding"
      - "/terraform/website"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "terraform"
    groups:
      terraform-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
