distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.1-bin.zip
# Per-read socket timeout for the distribution download. Raised from the 10s
# default to 60s (matching the CI integration-test wrapper in
# mockserver-netty-no-dependencies) so a transient stall on the Gradle CDN does
# not abort the download with "SocketTimeoutException: Read timed out".
networkTimeout=60000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# Published by Gradle as gradle-9.5.1-bin.zip.sha256. The wrapper refuses a downloaded
# distribution that does not match, so change it together with distributionUrl.
distributionSha256Sum=bafc141b619ad6350fd975fc903156dd5c151998cc8b058e8c1044ab5f7b031f
